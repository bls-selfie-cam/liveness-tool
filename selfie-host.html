<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Selfie Test</title>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:system-ui; }
        #msg {
            position:fixed; top:20px; left:50%; transform:translateX(-50%);
            background:#0d2818; color:#3fb950; padding:12px 20px;
            border-radius:8px; font-weight:600; z-index:9999;
            display:none; box-shadow:0 4px 16px rgba(0,0,0,0.5);
            max-width:90%; text-align:center;
        }
        #msg.show { display:block; }
        #msg.error { background:#2d0a0a; color:#f85149; }
        iframe { width:100%; height:100vh; border:none; }
    </style>
</head>
<body>
    <div id="msg"></div>
    <iframe id="frame"></iframe>

    <script>
        const frame = document.getElementById('frame');
        const msg = document.getElementById('msg');

        frame.src = 'https://morocco.blsportugal.com/MAR/appointment/livenessrequest';

        frame.onload = () => {
            showMsg('✅ iframe loaded! Trying to access...');
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                const appt = doc.querySelector('input[name="AppointmentData"]');
                if (appt) {
                    showMsg('✅ Fields found! X-Frame-Options allows!');
                } else {
                    showMsg('⚠ iframe loaded but no fields found.', true);
                }
            } catch(e) {
                showMsg('❌ Cannot access iframe: ' + e.message, true);
            }
        };

        frame.onerror = () => {
            showMsg('❌ iframe failed to load (BLS blocks embedding)', true);
        };

        function showMsg(text, isError) {
            msg.textContent = text;
            msg.className = isError ? 'show error' : 'show';
        }
    </script>
</body>
</html>
